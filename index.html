<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<title>Aside 원격</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --ink: #16181d; --muted: #6b7280; --line: #e3e5ea;
    --accent: #3b5bdb; --accent-ink: #fff; --ok: #2f9e44; --bad: #e03131; --code: #f0f1f4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111318; --card: #1b1e25; --ink: #e8eaef; --muted: #9097a3; --line: #2b2f38;
      --accent: #5c7cfa; --code: #14161b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  main { max-width: 640px; margin: 0 auto; padding: 12px 16px 40px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0 12px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  textarea, input, select { width: 100%; font: inherit; color: inherit; background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  textarea { min-height: 96px; resize: vertical; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 10px 14px; background: var(--line); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button.danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
  button:disabled { opacity: .5; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .row > select { flex: 1; min-width: 0; }
  .grow { flex: 1; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--line); white-space: nowrap; }
  .pill.running, .pill.queued { background: var(--accent); color: #fff; }
  .pill.done, .pill.idle { background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok); }
  .pill.error, .pill.errored, .pill.killed, .pill.kill_requested { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); display: inline-block; margin-right: 6px; }
  .dot.on { background: var(--ok); }
  .list { display: flex; flex-direction: column; }
  .item { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .item:first-child { border-top: 0; }
  .item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { font-size: 12px; color: var(--muted); }
  pre { background: var(--code); border-radius: 10px; padding: 10px; white-space: pre-wrap; word-break: break-word;
    font: 13px/1.45 ui-monospace, Consolas, monospace; max-height: 60vh; overflow: auto; margin: 8px 0 0; }
  .hidden { display: none !important; }
  .msg { color: var(--bad); font-size: 14px; margin-top: 6px; min-height: 1em; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button { flex: 1; }
  .tabs button.on { background: var(--ink); color: var(--bg); }
  .chat { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; max-height: 70vh; overflow: auto; }
  .bubble { padding: 8px 12px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; font-size: 15px; max-width: 88%; }
  .bubble.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
  .bubble.ai { align-self: flex-start; background: var(--code); border-bottom-left-radius: 4px; }
  .chat .sub { align-self: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Aside 원격</h1>
    <div id="state" class="sub"></div>
  </header>

  <section id="login" class="card hidden">
    <h2>접속 토큰</h2>
    <input id="token" type="password" autocomplete="current-password" placeholder="phoneToken">
    <div class="row"><button class="primary grow" id="saveToken">접속</button></div>
    <div class="msg" id="loginMsg"></div>
  </section>

  <div id="app" class="hidden">
    <div class="tabs">
      <button id="tabNew" class="on">새 작업</button>
      <button id="tabSes">세션</button>
      <button id="tabJobs">실행 기록</button>
    </div>

    <section id="paneNew">
      <div class="card">
        <h2>Aside에게 시킬 일</h2>
        <textarea id="prompt" placeholder="예: 지메일에서 오늘 온 메일 중 답장 필요한 것만 정리해줘"></textarea>
        <div class="row">
          <select id="effort">
            <option value="">생각: 기본</option>
            <option value="low">생각: 낮게</option>
            <option value="medium">생각: 보통</option>
            <option value="high">생각: 높게</option>
          </select>
          <select id="speed">
            <option value="">속도: 기본</option>
            <option value="fast">속도: 빠르게</option>
          </select>
        </div>
        <div class="row"><button class="primary grow" id="run">실행</button></div>
        <div class="msg" id="runMsg"></div>
      </div>
    </section>

    <section id="paneSes" class="hidden">
      <div class="card">
        <div class="row" style="margin-top:0"><h2 class="grow" style="margin:0">Aside 세션</h2><button id="reloadSes">새로고침</button></div>
        <div id="sesTime" class="sub"></div>
        <div id="sessions" class="list" style="margin-top:8px"></div>
      </div>
    </section>

    <section id="paneJobs" class="hidden">
      <div class="card">
        <h2>보낸 명령 (1주일 보관)</h2>
        <div id="jobs" class="list"></div>
      </div>
    </section>

    <section id="detail" class="card hidden">
      <div class="row" style="margin-top:0">
        <span id="dStatus" class="pill"></span>
        <strong id="dTitle" class="grow" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></strong>
        <button id="dClose">닫기</button>
      </div>
      <div id="dSub" class="sub"></div>
      <pre id="dLog"></pre>
      <div id="dChat" class="chat hidden"></div>
      <div class="row"><button id="dKill" class="danger">중단</button></div>
    </section>

    <section id="sesDetail" class="card hidden">
      <div class="row" style="margin-top:0">
        <span id="sStatus" class="pill"></span>
        <strong id="sTitle" class="grow" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></strong>
        <button id="sClose">닫기</button>
      </div>
      <div id="sSub" class="sub"></div>
      <div class="row"><button class="grow" data-act="history">지난 대화 보기</button></div>
      <textarea id="sPrompt" placeholder="이 세션에 보낼 말 (이어서 하기는 비워도 됨)" style="margin-top:8px;min-height:72px"></textarea>
      <div class="row">
        <button class="primary grow" data-act="resume">이어서</button>
        <button data-act="queue">대기열</button>
        <button data-act="steer">끼어들기</button>
        <button class="danger" data-act="stop">정지</button>
      </div>
      <div class="msg" id="sMsg"></div>
    </section>

    <div class="row" style="justify-content:center">
      <button id="launch">Aside 앱 켜기</button>
      <button id="logout">토큰 지우기</button>
    </div>
  </div>
</main>
<script>
// 공개돼도 되는 값 (Supabase 프로젝트 주소·publishable 키). 실제 권한은 토큰이 있어야 생긴다.
const SUPABASE_URL = 'https://tomfijfokckwyofaeerx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_7XES0lJiW33RCABFhrVfUA_9gl-Le5Q';

const $ = (id) => document.getElementById(id);
const store = {
  get() { try { return localStorage.getItem('asideToken') || ''; } catch { return ''; } },
  set(v) { try { v ? localStorage.setItem('asideToken', v) : localStorage.removeItem('asideToken'); } catch {} },
};
// 접속 링크(#k=토큰)로 열면 토큰을 저장하고 주소창에서 지운다
const fromHash = new URLSearchParams(location.hash.slice(1)).get('k');
if (fromHash) { store.set(fromHash); history.replaceState(null, '', location.pathname); }
let token = store.get();
let openJob = null, openSes = null, sessions = [], serverSkew = 0;

async function rpc(fn, args = {}) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_token: token, ...args }),
  });
  const text = await r.text();
  const data = text ? JSON.parse(text) : null;
  if (!r.ok) {
    if (data?.message === 'unauthorized') { showLogin('토큰이 틀립니다'); throw new Error('unauthorized'); }
    throw new Error(data?.message || r.statusText);
  }
  return data;
}

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ago = (t) => {
  const s = Math.max(0, Math.round((Date.now() + serverSkew - Date.parse(t)) / 1000));
  return s < 60 ? `${s}초 전` : s < 3600 ? `${Math.round(s/60)}분 전` : s < 172800 ? `${Math.round(s/3600)}시간 전` : `${Math.round(s/86400)}일 전`;
};
const label = { queued: 'PC 대기', running: '실행 중', done: '완료', error: '오류', killed: '중단됨', kill_requested: '중단 중', idle: '대기', errored: '오류' };
const kindLabel = { exec: '새 작업', resume: '이어서', steer: '끼어들기', queue: '대기열', stop: '정지', launch: '앱 켜기', sessions: '목록 갱신', history: '지난 대화' };
let chatShown = null;

function showLogin(msg) { $('login').classList.remove('hidden'); $('app').classList.add('hidden'); $('loginMsg').textContent = msg || ''; }
function showApp() { $('login').classList.add('hidden'); $('app').classList.remove('hidden'); }

function tab(name) {
  for (const [b, p] of [['tabNew','paneNew'],['tabSes','paneSes'],['tabJobs','paneJobs']]) {
    $(b).classList.toggle('on', p === name); $(p).classList.toggle('hidden', p !== name);
  }
}
$('tabNew').onclick = () => tab('paneNew');
$('tabSes').onclick = () => tab('paneSes');
$('tabJobs').onclick = () => tab('paneJobs');

async function refresh() {
  try {
    const s = await rpc('ar_phone_status');
    serverSkew = Date.parse(s.now) - Date.now();
    showApp();
    const st = s.state || {};
    const alive = st.worker_seen && (Date.now() + serverSkew - Date.parse(st.worker_seen)) < 90_000;
    $('state').innerHTML = !alive
      ? `<span class="dot"></span>PC 응답 없음${st.worker_seen ? ' (' + ago(st.worker_seen) + ')' : ''}`
      : `<span class="dot ${st.aside_running ? 'on' : ''}"></span>${st.aside_running ? 'Aside 켜짐' : 'Aside 꺼짐'}`;
    sessions = st.sessions || [];
    renderSessions();
    const jobs = s.jobs.filter((j) => j.kind !== 'history');
    $('jobs').innerHTML = jobs.length ? jobs.map((j) => `
      <div class="item" data-job="${j.id}">
        <span class="pill ${j.status}">${label[j.status] || j.status}</span>
        <div class="t">${esc(j.prompt || kindLabel[j.kind])}<div class="sub">${kindLabel[j.kind] || j.kind} · ${ago(j.created_at)}</div></div>
      </div>`).join('') : '<div class="sub">아직 없음</div>';
    if (openJob) loadJob(openJob);
  } catch {}
}
$('jobs').onclick = (e) => { const el = e.target.closest('[data-job]'); if (el) loadJob(+el.dataset.job, true); };

async function loadJob(id, scroll) {
  openJob = id;
  const j = await rpc('ar_phone_job', { p_id: id });
  if (!j) return;
  $('detail').classList.remove('hidden');
  $('dStatus').className = 'pill ' + j.status; $('dStatus').textContent = label[j.status] || j.status;
  $('dTitle').textContent = j.prompt || kindLabel[j.kind];
  $('dSub').textContent = `${kindLabel[j.kind] || j.kind}${j.session_id ? ' · ' + j.session_id : ''} · ${ago(j.created_at)}`;
  const isChat = j.kind === 'history' && j.status === 'done';
  $('dLog').classList.toggle('hidden', isChat);
  $('dChat').classList.toggle('hidden', !isChat);
  if (isChat) {
    if (chatShown !== j.id) renderChat(j);
    $('dKill').classList.add('hidden');
    if (scroll) $('detail').scrollIntoView({ behavior: 'smooth' });
    return;
  }
  const pre = $('dLog'); const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 20;
  pre.textContent = j.log || (j.status === 'queued' ? '(PC가 받아가기를 기다리는 중…)' : '(출력 기다리는 중…)');
  if (atBottom || scroll) pre.scrollTop = pre.scrollHeight;
  $('dKill').classList.toggle('hidden', !['queued', 'running'].includes(j.status));
  if (scroll) $('detail').scrollIntoView({ behavior: 'smooth' });
}
$('dClose').onclick = () => { openJob = null; chatShown = null; $('detail').classList.add('hidden'); };

function renderChat(j) {
  chatShown = j.id;
  let h;
  try { h = JSON.parse(j.log); } catch { $('dChat').innerHTML = `<pre>${esc(j.log)}</pre>`; return; }
  if (h.title) $('dTitle').textContent = h.title;
  const when = (s) => new Date(s * 1000).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  $('dChat').innerHTML = h.turns.length ? h.turns.map((t) => `
    <div class="sub">${when(t.at)}${t.state === 'aborted' ? ' · 중단됨' : t.state === 'running' ? ' · 진행 중' : ''}</div>
    ${t.user ? `<div class="bubble user">${esc(t.user)}</div>` : ''}
    ${t.assistant ? `<div class="bubble ai">${esc(t.assistant)}</div>` : ''}`).join('')
    : '<div class="sub">대화 기록이 없습니다</div>';
  $('dChat').scrollTop = $('dChat').scrollHeight;
}
$('dKill').onclick = async () => { if (confirm('이 실행을 중단할까요?')) { await rpc('ar_phone_kill', { p_id: openJob }); refresh(); } };

async function submit(kind, extra = {}) {
  const id = await rpc('ar_phone_submit', { p_kind: kind, ...extra });
  await refresh(); loadJob(id, true);
}

$('run').onclick = async () => {
  const prompt = $('prompt').value.trim();
  if (!prompt) return ($('runMsg').textContent = '할 일을 적어 주세요');
  $('run').disabled = true; $('runMsg').textContent = '';
  try {
    await submit('exec', { p_prompt: prompt, p_effort: $('effort').value || null, p_speed: $('speed').value || null });
    $('prompt').value = '';
  } catch (e) { $('runMsg').textContent = e.message; }
  $('run').disabled = false;
};

function renderSessions() {
  $('sessions').innerHTML = sessions.map((s, i) => `
    <div class="item" data-ses="${i}">
      <span class="pill ${esc(s.state)}">${label[s.state] || esc(s.state)}</span>
      <div class="t">${esc(s.title)}<div class="sub">${esc(s.id)} · ${ago(s.updated)}</div></div>
    </div>`).join('') || '<div class="sub">세션 목록이 아직 없음 (PC가 1분마다 올림)</div>';
}
$('reloadSes').onclick = () => submit('sessions').catch((e) => alert(e.message));
$('sessions').onclick = (e) => {
  const el = e.target.closest('[data-ses]'); if (!el) return;
  openSes = sessions[+el.dataset.ses];
  $('sesDetail').classList.remove('hidden');
  $('sStatus').className = 'pill ' + openSes.state; $('sStatus').textContent = label[openSes.state] || openSes.state;
  $('sTitle').textContent = openSes.title; $('sSub').textContent = openSes.id; $('sMsg').textContent = '';
  $('sesDetail').scrollIntoView({ behavior: 'smooth' });
};
$('sClose').onclick = () => { openSes = null; $('sesDetail').classList.add('hidden'); };
$('sesDetail').onclick = async (e) => {
  const act = e.target.dataset?.act; if (!act || !openSes) return;
  if (act === 'history') {
    $('sMsg').textContent = '';
    return submit('history', { p_session_id: openSes.id }).catch((err) => ($('sMsg').textContent = err.message));
  }
  if (act === 'stop' && !confirm(`"${openSes.title}" 세션을 정지할까요?`)) return;
  const prompt = $('sPrompt').value.trim();
  if (['steer', 'queue'].includes(act) && !prompt) return ($('sMsg').textContent = '보낼 말을 적어 주세요');
  $('sMsg').textContent = '';
  try {
    await submit(act, { p_session_id: openSes.id, p_prompt: prompt || null });
    $('sPrompt').value = '';
  } catch (err) { $('sMsg').textContent = err.message; }
};

$('launch').onclick = () => submit('launch').catch((e) => alert(e.message));
$('logout').onclick = () => { token = ''; store.set(''); showLogin(); };
$('saveToken').onclick = () => { token = $('token').value.trim(); store.set(token); refresh(); };
$('token').onkeydown = (e) => { if (e.key === 'Enter') $('saveToken').click(); };

if (token) refresh(); else showLogin();
setInterval(() => { if (token && !document.hidden) refresh(); }, 3000);
</script>
</body>
</html>
